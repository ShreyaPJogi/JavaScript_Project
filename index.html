<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LeetMetric</h1>
        <div class="user-container">
            <p>Enter your username below</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter your name" id="user-input">
                <button id="serach-btn">Search</button>
            </div>

        </div>

        <div class="stats-container ">
            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-label">Easy</span>
                    </div>
                </div>
                <div class="progress-item">
                    
                    <div class="med-progress circle">
                        <span id="med-label">Medium</span>
                    </div>
                </div>
                
                <div class="progress-item">
                    
                    <div class="Hard-progress circle">
                        <span id="Hard-label">Hard</span>
                    </div>
                </div>
                </div>

                <div class="stats-card">
                    <!-- directly populate fron js code -->
                </div>
            </div>
            

        </div>

    <script src="script.js"></script>
</body>
</html>
